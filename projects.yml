# Multi-Project Docker Configuration
# This file defines all Docker projects in this repository

projects:
  askappy-base:
    name: "askappy-base"
    description: "Base image with casacore and python tools needed by ASKAPpipeline in ASKAP operations"
    registry: "docker.io"
    image_name: "wasimraja81/askappy-ubuntu-24.04"
    base_tag: "askappy-base-mpich-casacore-3.7.1"
    dockerfile: "Dockerfile"
    context: "./askappy-base"
    platforms: "linux/amd64,linux/arm64"
    enabled: false
    labels:
      org.opencontainers.image.title: "askappy-base"
      org.opencontainers.image.description: "Base image with casacore and python tools needed by ASKAPpipeline in ASKAP operations"
      org.opencontainers.image.vendor: "CSIRO"
      repo.name: "askappy"
      repo.version: "base-casacore-3.7.1"
      casacore.version: "v3.7.1"
      mpich.version: "4.3.1"

  tostool:
    name: "tostool"
    description: "Tools for ASKAP TOS (Telescope Operating System) - Ubuntu 24.04"
    registry: "docker.io"
    image_name: "wasimraja81/tostool-ubuntu-24.04"
    base_tag: "2.28.0.3"
    dockerfile: "Dockerfile"
    context: "./tostool"
    platforms: "linux/amd64,linux/arm64"
    enabled: false 
    labels:
      org.opencontainers.image.title: "tostool"
      org.opencontainers.image.description: "ASKAP TOS tools built on Ubuntu 24.04 with casacore"
      org.opencontainers.image.vendor: "CSIRO"
      repo.name: "tostool"
      repo.version: "2.28.0"
      casacore.version: "v3.7.1"
      mpich.version: "4.3.1"
      base.image: "wasimraja81/base-casacore:casacore-3.7.1-20250810-607f488"

  base-mpich:
    name: "base-mpich"
    description: "Base image with MPICH only (no casacore), for scientific stack builds"
    registry: "docker.io"
    image_name: "wasimraja81/base-mpich"
    base_tag: "mpich-4.3.1"
    dockerfile: "Dockerfile"
    context: "./base-mpich"
    platforms: "linux/amd64,linux/arm64"
    enabled: false
    base_image: "ubuntu:24.04"
    labels:
      org.opencontainers.image.title: "base-mpich"
      org.opencontainers.image.description: "Base image with MPICH only, based on ubuntu:24.04"
      org.opencontainers.image.vendor: "CSIRO"
      repo.name: "base-mpich"
      repo.version: "mpich-4.3.1"
      mpich.version: "4.3.1"
      base.image: "ubuntu:24.04"

  base-casacore:
    name: "base-casacore"
    description: "Base image with MPICH and Casacore, for scientific stack builds"
    registry: "docker.io"
    image_name: "wasimraja81/base-casacore"
    base_tag: "casacore-3.7.1"
    dockerfile: "Dockerfile"
    context: "./base-casacore"
    platforms: "linux/amd64,linux/arm64"
    enabled: false
    labels:
      org.opencontainers.image.title: "base-casacore"
      org.opencontainers.image.description: "Base image with MPICH and Casacore"
      org.opencontainers.image.vendor: "CSIRO"
      repo.name: "base-casacore"
      repo.version: "casacore-3.7.1"
      casacore.version: "v3.7.1"
      mpich.base.image: "wasimraja81/base-mpich:mpich-4.3.1-20250807-53a3b2a"
