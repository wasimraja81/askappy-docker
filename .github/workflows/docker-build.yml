name: Build and Push Docker Images

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]  # Trigger on version tags
    paths:
      - 'askappy-base/**'
      - 'tostool/**'
      - '.github/workflows/docker-build.yml'
      - 'projects.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'askappy-base/**'
      - 'tostool/**'
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      project:
        description: 'Project to build (or "all" for all enabled projects)'
        required: false
        default: 'all'
        type: choice
        options:
        - 'all'
        - 'askappy-base'
        - 'tostool'
      platforms:
        description: 'Target platforms'
        required: false
        default: 'linux/amd64,linux/arm64'
        type: string

env:
  REGISTRY: docker.io

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      askappy-base: ${{ steps.changes.outputs.askappy-base }}
      tostool: ${{ steps.changes.outputs.tostool }}
      projects: ${{ steps.projects.outputs.projects }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Detect changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          askappy-base:
            - 'askappy-base/**'
          tostool:
            - 'tostool/**'
            
    - name: Determine projects to build
      id: projects
      #
      # NOTE FOR MAINTAINERS:
      #
      # - In YAML expressions (e.g., 'if:' or 'with:'), use ${{ github.event_name }} and ${{ github.event.inputs.project }}.
      #   These are always defined for 'github.event_name', but 'github.event.inputs.project' is only set for workflow_dispatch.
      # - In shell scripts (under 'run:'), use $GITHUB_EVENT_NAME and $INPUT_PROJECT.
      #   $GITHUB_EVENT_NAME is always set; $INPUT_PROJECT is only set for workflow_dispatch.
      # - For push/pull_request triggers, $INPUT_PROJECT is empty/unset, so change detection is used instead.
      #
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
          if [[ "$INPUT_PROJECT" == "all" || -z "$INPUT_PROJECT" ]]; then
            echo 'projects=["askappy-base","tostool"]' >> $GITHUB_OUTPUT
          else
            echo "projects=[\"$INPUT_PROJECT\"]" >> $GITHUB_OUTPUT
          fi
        else
          projects=()
          if [[ "${{ steps.changes.outputs.askappy-base }}" == "true" ]]; then
            projects+=("askappy-base")
          fi
          # Enable tostool builds
          if [[ "${{ steps.changes.outputs.tostool }}" == "true" ]]; then
            projects+=("tostool")
          fi
          if [[ ${#projects[@]} -eq 0 ]]; then
            echo "projects=[]" >> $GITHUB_OUTPUT
          else
            # Convert bash array to JSON array
            printf -v joined '"%s",' "${projects[@]}"
            echo "projects=[${joined%,}]" >> $GITHUB_OUTPUT
          fi
        fi

  build-askappy-base:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ contains(fromJSON(needs.detect-changes.outputs.projects), 'askappy-base') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/wasimraja81/askappy-ubuntu-24.04
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=base-mpich-casacore-3.6.1
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
          type=raw,value={{date 'YYYYMMDD'}}
        labels: |
          org.opencontainers.image.title=askappy-base
          org.opencontainers.image.description=Docker image for askappy-base
          org.opencontainers.image.vendor=CSIRO

    - name: Build and push askappy-base image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./askappy-base
        file: ./askappy-base/Dockerfile
        platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          CPU_CORE_COUNT=4
        cache-from: type=gha,scope=askappy-base
        cache-to: type=gha,mode=max,scope=askappy-base

    - name: Test askappy-base image (AMD64 only)
      run: |
        # Test the askappy-base image
        docker run --rm --platform linux/amd64 ${{ env.REGISTRY }}/wasimraja81/askappy-ubuntu-24.04:base-mpich-casacore-3.6.1 python3 -c "
        import sys
        print(f'Python version: {sys.version}')
        
        # Test casacore
        try:
            import casacore
            print('✓ Casacore imported successfully')
        except ImportError as e:
            print(f'✗ Casacore import failed: {e}')
            sys.exit(1)
        
        # Test scientific packages
        packages = ['numpy', 'astropy', 'pandas', 'matplotlib', 'scipy']
        for pkg in packages:
            try:
                __import__(pkg)
                print(f'✓ {pkg} imported successfully')
            except ImportError as e:
                print(f'✗ {pkg} import failed: {e}')
                sys.exit(1)
        
        print('✓ All tests passed!')
        "

    - name: Generate SBOM
      if: github.event_name != 'pull_request'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/wasimraja81/askappy-ubuntu-24.04:base-mpich-casacore-3.6.1
        output-file: sbom-askappy-base.spdx.json
        upload-artifact: true

  build-tostool:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-askappy-base]
    # Run if tostool needs building, and either askappy-base completed successfully or wasn't needed
    if: ${{ contains(fromJSON(needs.detect-changes.outputs.projects), 'tostool') && (needs.build-askappy-base.result == 'success' || needs.build-askappy-base.result == 'skipped') }}
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      with:
        platforms: linux/amd64,linux/arm64

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Determine base image
      id: base-image
      run: |
        if [[ "${{ needs.build-askappy-base.result }}" == "success" ]]; then
          # Use the newly built askappy-base from this commit
          echo "base_image=${{ env.REGISTRY }}/wasimraja81/askappy-ubuntu-24.04:${{ github.ref_name }}" >> $GITHUB_OUTPUT
          echo "Using newly built askappy-base from this commit"
        else
          # Use the latest askappy-base from registry
          echo "base_image=${{ env.REGISTRY }}/wasimraja81/askappy-ubuntu-24.04:base-mpich-casacore-3.6.1" >> $GITHUB_OUTPUT
          echo "Using existing askappy-base from registry"
        fi

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/wasimraja81/tostool-ubuntu-24.04
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=raw,value=2.28.0
          type=raw,value=latest,enable={{is_default_branch}}
          type=raw,value={{date 'YYYYMMDD'}}-{{sha}}
          type=raw,value={{date 'YYYYMMDD'}}
        labels: |
          org.opencontainers.image.title=tostool
          org.opencontainers.image.description=Docker image for tostool
          org.opencontainers.image.vendor=CSIRO

    - name: Build and push tostool image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: ./tostool
        file: ./tostool/Dockerfile
        platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          VCS_REF=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.revision'] }}
          VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          BASE_IMAGE=${{ steps.base-image.outputs.base_image }}
          CPU_CORE_COUNT=4
        cache-from: type=gha,scope=tostool
        cache-to: type=gha,mode=max,scope=tostool

    - name: Test tostool image (AMD64 only)
      run: |
        # Test the tostool image
        echo "Testing ASKAP command-line tools..."
        docker run --rm --platform linux/amd64 ${{ env.REGISTRY }}/wasimraja81/tostool-ubuntu-24.04:2.28.0 schedblock info -h > /dev/null
        echo "Testing Python environment..."
        docker run --rm --platform linux/amd64 ${{ env.REGISTRY }}/wasimraja81/tostool-ubuntu-24.04:2.28.0 python3 -c "
        import sys
        print(f'Python version: {sys.version}')
        
        # Test core scientific packages
        try:
            import casacore, numpy
            print('✓ Core packages (casacore, numpy) imported successfully')
        except ImportError as e:
            print(f'✗ Core package import failed: {e}')
            sys.exit(1)
        
        print('✓ tostool test passed!')
        "

    - name: Generate SBOM
      if: github.event_name != 'pull_request'
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/wasimraja81/tostool-ubuntu-24.04:2.28.0
        output-file: sbom-tostool.spdx.json
        upload-artifact: true

  # Legacy build job for backward compatibility (will be skipped)
  build:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: false  # Disabled - replaced by specific build jobs above
    steps:
      - run: echo "Legacy job disabled"

  security-scan:
    runs-on: ubuntu-latest
    needs: [build-askappy-base, build-tostool]
    if: always() && (needs.build-askappy-base.result == 'success' || needs.build-tostool.result == 'success')
    strategy:
      matrix:
        include:
          - project: askappy-base
            image: wasimraja81/askappy-ubuntu-24.04:base-mpich-casacore-3.6.1
            condition: ${{ needs.build-askappy-base.result == 'success' }}
          - project: tostool
            image: wasimraja81/tostool-ubuntu-24.04:2.28.0
            condition: ${{ needs.build-tostool.result == 'success' }}
    
    steps:
    - name: Check if scan should run
      id: should-run
      run: |
        if [[ "${{ matrix.condition }}" == "true" ]]; then
          echo "should_run=true" >> $GITHUB_OUTPUT
        else
          echo "should_run=false" >> $GITHUB_OUTPUT
        fi

    - name: Run Trivy vulnerability scanner
      if: steps.should-run.outputs.should_run == 'true'
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ matrix.image }}
        format: sarif
        output: trivy-results-${{ matrix.project }}.sarif

    - name: Upload Trivy scan results to GitHub Security tab
      if: steps.should-run.outputs.should_run == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: trivy-results-${{ matrix.project }}.sarif
        category: ${{ matrix.project }}-security-scan
